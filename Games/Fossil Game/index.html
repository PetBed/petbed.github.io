<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202622" />
    <title>Basalt Basin — Fossil Factory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-screen" aria-label="Basalt Basin fossil factory">
      <canvas id="world-canvas" aria-label="Top-down factory map"></canvas>

      <header class="hud top-hud">
        <div class="site-mark">
          <strong id="site-name">Basalt Basin</strong>
          <span>Excavation site</span>
        </div>
        <nav id="site-navigation" class="site-navigation" aria-label="Dig sites"></nav>
        <div id="resource-strip" class="resource-strip" aria-label="Site resources"></div>
        <div class="power-readout">Power <strong id="power-value">0</strong></div>
        <p id="save-warning" class="save-warning" role="alert" hidden></p>
      </header>

      <nav class="hud build-tools" aria-label="Factory construction">
        <p class="hud-heading">Build</p>
        <button class="build-button selected" data-build="belt">
          <span class="build-label"><span class="build-name">Belt</span><kbd>1</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="excavator">
          <span class="build-label"><span class="build-name">Excavator</span><kbd>2</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="generator">
          <span class="build-label"><span class="build-name">Generator</span><kbd>3</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="smelter">
          <span class="build-label"><span class="build-name">Smelter</span><kbd>4</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="crusher">
          <span class="build-label"><span class="build-name">Crusher</span><kbd>5</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="fossil-finisher">
          <span class="build-label"><span class="build-name">Fossil finisher</span><kbd>6</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button" data-build="splitter">
          <span class="build-label"><span class="build-name">Splitter</span><kbd>7</kbd></span>
          <span class="build-cost"></span>
          <span class="build-affordability"></span>
        </button>
        <button class="build-button remove-button" data-build="remove">
          <span class="build-label"><span class="build-name">Remove</span><kbd>8</kbd></span>
          <span class="build-affordability">Click removes · drag sweeps belts</span>
        </button>
        <p id="build-hint" class="build-hint">Eastbound belt · R rotates</p>
        <button id="cancel-build" class="quiet-button">Inspect <kbd>Esc</kbd></button>
      </nav>

      <aside class="hud minimap-panel" aria-label="Factory minimap">
        <canvas id="minimap-canvas" aria-label="Click to recenter the factory map"></canvas>
        <span>Map · click to travel</span>
      </aside>

      <aside class="hud inspector-panel" aria-live="polite">
        <h2 id="inspect-title">Factory</h2>
        <p id="inspect-copy">Belts carry excavated items to the warehouse. Place a route from the excavator output.</p>
        <div id="inspect-details"></div>
      </aside>

      <section class="hud inventory-panel" aria-label="Fossil inventory">
        <div class="panel-title-row">
          <h2>Fossils</h2>
          <button id="expand-museum" class="quiet-button">Expand museum · 8 iron / 8 stone</button>
        </div>
        <div class="fossil-columns">
          <div>
            <h3>Unidentified</h3>
            <ul id="unidentified-list" class="fossil-items"></ul>
          </div>
          <div>
            <h3>Museum <span id="museum-count"></span></h3>
            <div id="museum-slots" class="museum-slots"></div>
            <ul id="collection-list" class="fossil-items"></ul>
          </div>
        </div>
      </section>

      <aside class="hud event-panel" aria-label="Factory events">
        <h2>Factory log</h2>
        <ul id="event-log" class="event-log" aria-live="polite"></ul>
      </aside>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
